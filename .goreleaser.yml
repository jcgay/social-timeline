version: 2

project_name: social-timeline

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/social-timeline
    binary: social-timeline
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^📝"
      - "^🔧"
      - Merge pull request
      - Merge branch
