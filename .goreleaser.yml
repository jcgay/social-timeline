version: 2

project_name: social-timeline

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/social-timeline
    binary: social-timeline
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

brews:
  - name: social-timeline
    repository:
      owner: jcgay
      name: homebrew-jcgay
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/jcgay/social-timeline"
    description: "Fetch Bluesky and Mastodon home timelines as Markdown"
    license: "MIT"
    install: |
      bin.install "social-timeline"
    test: |
      system "#{bin}/social-timeline", "--version"

changelog:
  sort: asc
  filters:
    exclude:
      - "^📝"
      - "^🔧"
      - Merge pull request
      - Merge branch
